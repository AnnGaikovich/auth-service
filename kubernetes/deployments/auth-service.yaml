apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
    
      initContainers:
      - name: wait-for-user-service
        image: curlimages/curl:latest
        command: ['sh', '-c', 'until curl -f http://user-service:80/actuator/health; do echo waiting for user-service; sleep 2; done;']
      
      - name: init-auth-db
        image: postgres:15
        command: ['sh', '-c', 'psql -h postgres-service -U postgres -c "CREATE DATABASE auth_service_db;" 2>/dev/null || true']
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: DB_PASSWORD
      
      containers:
      - name: auth-service
        image: auth-service:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
          name: http
        
        volumeMounts:
        - name: jwt-keys
          mountPath: /app/keys
          readOnly: true
        
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: DB_URL
          value: "jdbc:postgresql://postgres-service:5432/auth_service_db"
        - name: DB_USERNAME
          value: "postgres"
        - name: DB_PASSWORD
          value: "123456"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis-service"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: USER_SERVICE_URL
          value: "http://user-service:80"
        - name: USER_SERVICE_API_KEY
          value: "internal-auth-key-12345"
        - name: MANAGEMENT_SECURITY_ENABLED
          value: "false"
        
        # Health Probes
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      
      volumes:
      - name: jwt-keys
        secret:
          secretName: auth-service-secret
          items:
          - key: JWT_PUBLIC_KEY
            path: public.pem
          - key: JWT_PRIVATE_KEY
            path: private.pem