version: '3.8'

services:
  auth-db:
    image: postgres:15-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_DB: auth_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5435:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    container_name: auth-service-application
    ports:
      - "8082:8082"
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - USER_SERVICE_API_KEY=internal-auth-key-12345
    volumes:
      - ./src/main/resources/keys:/app/keys
    networks:
      - microservices-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: auth-service-prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  loki:
      image: grafana/loki:2.9.0
      container_name: auth-service-loki
      ports:
        - "3101:3100"
      command: -config.file=/etc/loki/local-config.yaml
      volumes:
        - loki_data:/loki
      networks:
        - monitoring
      restart: unless-stopped

  tempo:
      image: grafana/tempo:2.2.2
      container_name: auth-service-tempo
      ports:
        - "3201:82"
        - "4318:4317"
        - "4319:4318"
      command:
        - "--storage.trace.backend=local"
        - "--storage.trace.local.path=/tmp/tempo/blocks"
        - "--storage.trace.wal.path=/tmp/tempo/wal"
      networks:
        - monitoring
      restart: unless-stopped

  grafana:
      image: grafana/grafana:10.1.0
      container_name: auth-service-grafana
      ports:
        - "3001:3000"
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=admin
      networks:
        - monitoring
      depends_on:
        - prometheus
        - loki
        - tempo
      restart: unless-stopped

volumes:
  postgres_auth_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
    microservices-network:
      driver: bridge
    monitoring:
      driver: bridge
      name: auth-service-monitoring