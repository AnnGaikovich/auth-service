apiVersion: 1

providers:
  - name: 'Auth Service Dashboards'
    orgId: 1
    folder: 'Auth Service'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true